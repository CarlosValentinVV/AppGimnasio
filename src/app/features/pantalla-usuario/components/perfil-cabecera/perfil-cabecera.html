<section class="tarjeta tarjeta-perfil">
  <button
    (click)="cambiarTema.emit()"
    [attr.aria-label]="modoOscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    class="boton-tema"
    title="Cambiar tema"
    type="button"
  >
    @if (modoOscuro()) {
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" x2="12" y1="1" y2="3" />
        <line x1="12" x2="12" y1="21" y2="23" />
        <line x1="4.22" x2="5.64" y1="4.22" y2="5.64" />
        <line x1="18.36" x2="19.78" y1="18.36" y2="19.78" />
        <line x1="1" x2="3" y1="12" y2="12" />
        <line x1="21" x2="23" y1="12" y2="12" />
        <line x1="4.22" x2="5.64" y1="19.78" y2="18.36" />
        <line x1="18.36" x2="19.78" y1="5.64" y2="4.22" />
      </svg>
    } @else {
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    }
  </button>

  <div class="cabecera-contenido">
    <div class="avatar-grande">
      @if (usuario().fotoUrl) {
        <img [alt]="'Foto de perfil de ' + usuario().nombre" [src]="usuario().fotoUrl" />
      } @else {
        <span>{{ usuario().iniciales }}</span>
      }
      <button aria-label="Cambiar foto de perfil" class="boton-foto" type="button">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
      </button>
    </div>

    <div class="cabecera-datos">
      <h1 class="nombre-usuario">{{ usuario().nombre }}</h1>
      <div class="cabecera-meta">
        <span class="chip chip-plan">{{ usuario().plan }}</span>
        <span class="chip">Miembro desde {{ usuario().miembroDesde }}</span>
        <span class="chip">{{ usuario().ciudad }}</span>
      </div>

      <div class="nivel">
        <div class="nivel-cabecera">
          <span class="nivel-nombre">{{ usuario().nivel }}</span>
          <span class="nivel-puntos">
            {{ usuario().puntosNivel }} / {{ usuario().puntosSiguienteNivel }} puntos
          </span>
        </div>
        <div [attr.aria-valuenow]="porcentajeNivel()" aria-valuemax="100" aria-valuemin="0" class="nivel-barra"
             role="progressbar">
          <div [style.width.%]="porcentajeNivel()" class="nivel-progreso"></div>
        </div>
      </div>
    </div>

    <button (click)="editar.emit()" class="boton-editar" type="button">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
      </svg>
      Editar perfil
    </button>
  </div>
</section>
