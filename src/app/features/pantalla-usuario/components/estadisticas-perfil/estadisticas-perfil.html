<section class="grid-estadisticas">
  @for (stat of estadisticas(); track stat.id) {
    <article class="tarjeta tarjeta-estadistica">
      <div class="estadistica-icono">
        @switch (stat.icono) {
          @case ('calendar') {
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('flame') {
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 2c1 4-4 6-4 10a4 4 0 008 0c0-1.5-.5-2.5-1-3.5 2 .5 4 2.5 4 5.5a7 7 0 11-14 0c0-5 6-7 7-12z"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('clock') {
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('trophy') {
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path
                d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4a1 1 0 00-1 1 4 4 0 004 4M17 6h3a1 1 0 011 1 4 4 0 01-4 4"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          }
          @case ('target') {
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="6" />
              <circle cx="12" cy="12" r="2" />
            </svg>
          }
        }
      </div>
      <span class="estadistica-valor">{{ stat.valor }}</span>
      <span class="estadistica-etiqueta">{{ stat.etiqueta }}</span>
      <span class="estadistica-detalle">{{ stat.detalle }}</span>
    </article>
  }
</section>
