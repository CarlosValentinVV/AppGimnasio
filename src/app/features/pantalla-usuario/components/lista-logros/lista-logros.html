<section class="tarjeta">
  <h2 class="titulo-tarjeta">Logros</h2>
  <p class="subtitulo-tarjeta">
    {{ logrosConseguidos() }} de {{ logros().length }} conseguidos
  </p>

  <div class="grid-logros">
    @for (logro of logros(); track logro.id) {
      <div [class.bloqueado]="!logro.conseguido" [title]="logro.conseguido ? logro.descripcion : 'Logro bloqueado'"
           class="logro">
        <div class="logro-icono">
          @switch (logro.icono) {
            @case ('dumbbell') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M8 4v16M16 4v16" stroke-linecap="round"
                      stroke-linejoin="round" />
              </svg>
            }
            @case ('flame') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 2c1 4-4 6-4 10a4 4 0 008 0c0-1.5-.5-2.5-1-3.5 2 .5 4 2.5 4 5.5a7 7 0 11-14 0c0-5 6-7 7-12z"
                      stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('clock') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <polyline points="12 6 12 12 16 14" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('trophy') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path
                  d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM7 6H4a1 1 0 00-1 1 4 4 0 004 4M17 6h3a1 1 0 011 1 4 4 0 01-4 4"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
            @case ('target') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <circle cx="12" cy="12" r="6" />
                <circle cx="12" cy="12" r="2" />
              </svg>
            }
            @case ('star') {
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <polygon
                  points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
          }
        </div>
        <span class="logro-titulo">{{ logro.titulo }}</span>
      </div>
    }
  </div>
</section>
