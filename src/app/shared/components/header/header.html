<header class="cabecera">
  <div class="cabecera-contenedor">
    <a aria-label="Jimnasio Gym, inicio" class="marca" routerLink="/">
      <img
        alt=""
        aria-hidden="true"
        class="marca-icono marca-logo marca-logo--claro"
        height="38"
        src="logo-jimnasio-claro.svg"
        width="38"
      />
      <img
        alt=""
        aria-hidden="true"
        class="marca-icono marca-logo marca-logo--oscuro"
        height="38"
        src="logo-jimnasio-oscuro.svg"
        width="38"
      />
      <span class="marca-texto">JIMNASIO</span>
    </a>

    <nav aria-label="Principal" class="navegacion-desktop">
      @for (enlace of enlacesNavegacion; track enlace.fragmento) {
        <a [fragment]="enlace.fragmento" class="nav-enlace" routerLink="/">{{ enlace.etiqueta }}</a>
      }
    </nav>

    <div class="cabecera-acciones">
      <button
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        class="boton-tema"
        title="Cambiar tema"
        type="button"
      >
        @if (isDarkMode()) {
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" x2="12" y1="1" y2="3" />
            <line x1="12" x2="12" y1="21" y2="23" />
            <line x1="4.22" x2="5.64" y1="4.22" y2="5.64" />
            <line x1="18.36" x2="19.78" y1="18.36" y2="19.78" />
            <line x1="1" x2="3" y1="12" y2="12" />
            <line x1="21" x2="23" y1="12" y2="12" />
            <line x1="4.22" x2="5.64" y1="19.78" y2="18.36" />
            <line x1="18.36" x2="19.78" y1="5.64" y2="4.22" />
          </svg>
        } @else {
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <!-- Enlace a la pantalla de acceso (inicio de sesión y registro) -->
      <a class="boton boton-secundario boton-pequeno enlace-acceso" routerLink="/login">
        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
             viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" x2="3" y1="12" y2="12" />
        </svg>
        <span>Acceso</span>
      </a>

      <a class="boton boton-secundario boton-pequeno enlace-perfil" routerLink="/perfil">
        <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
             viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Mi perfil</span>
      </a>

      <a [fragment]="'planes'" class="boton boton-primario boton-pequeno" routerLink="/">Probar gratis</a>

      <button
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="menu-movil-principal"
        aria-label="Abrir menú de navegación"
        class="menu-hamburguesa"
        type="button"
      >
        <svg class="icono-menu" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
          @if (!mobileMenuOpen()) {
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          } @else {
            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
          }
        </svg>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <div id="menu-movil-principal" class="menu-movil">
      <nav aria-label="Menú móvil">
        @for (enlace of enlacesNavegacion; track enlace.fragmento) {
          <a (click)="closeMobileMenu()" [fragment]="enlace.fragmento" routerLink="/">{{ enlace.etiqueta }}</a>
        }

        <a (click)="closeMobileMenu()" class="menu-movil-perfil" routerLink="/login">Acceso</a>
        <a (click)="closeMobileMenu()" class="menu-movil-perfil" routerLink="/perfil">Mi perfil</a>

        <div class="menu-movil-tema">
          <span>Modo de color:</span>
          <button (click)="toggleTheme()" class="filtro-btn" type="button">
            {{ isDarkMode() ? 'Cambiar a claro' : 'Cambiar a oscuro' }}
          </button>
        </div>

        <a (click)="closeMobileMenu()" [fragment]="'planes'" class="boton boton-primario" routerLink="/">
          Probar gratis
        </a>
      </nav>
    </div>
  }
</header>
